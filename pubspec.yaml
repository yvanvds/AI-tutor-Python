name: ai_tutor_python
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+17

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  py_runner:
    path: packages/py_runner
  multi_split_view: ^3.6.1
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  flutter_chat_ui: ^2.9.1
  flutter_chat_core: ^2.8.0
  flyer_chat_text_message: ^2.5.1
  flyer_chat_system_message: ^2.1.13
  flyer_chat_text_stream_message: ^2.2.6
  gpt_markdown: ^1.1.4
  collection: ^1.19.1
  dart_openai:
    git:
      url: https://github.com/yvanvds/openai.git
  envied: ^1.3.1
  loading_animation_widget: ^1.3.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  pub_semver: ^2.2.0
  http: ^1.5.0
  crypto: ^3.0.6
  uuid: ^4.5.2
  flutter_riverpod: ^2.6.1
  provider: ^6.1.5+1
  lottie: ^3.2.0
  audioplayers: ^6.5.1
  file_picker: ^8.1.6
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  webview_all: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end flows under integration_test/ (issue #28):
  #   flutter test integration_test -d windows
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  envied_generator: ^1.3.1
  build_runner: ^2.7.1
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  # Fake WebViewPlatform for lesson-view widget tests (already transitive
  # via webview_all; listed so tests may import it directly).
  webview_flutter_platform_interface: ^2.15.1

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - google_fonts/
    - assets/images/Confetti.json
    - assets/sounds/goal_reached.mp3
    - assets/sounds/note.mp3
    - assets/sounds/question.mp3
    - assets/sounds/chime.mp3
    - assets/lesson/lesson.css


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

  fonts:
    - family: monospace
      fonts:
        - asset: assets/fonts/SVBasicManual.ttf
        - asset: assets/fonts/SVBasicManual-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package





















