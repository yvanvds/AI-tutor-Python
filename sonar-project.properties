sonar.projectKey=yvanvds_AI-tutor-Python
sonar.organization=yvanvds

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=AITutor
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=lib
sonar.tests=test
sonar.exclusions=scripts/**
sonar.test.exclusions=scripts/**
sonar.coverage.exclusions=\
  lib/**/*.g.dart,\
  lib/main.dart,\
  lib/theme.dart,\
  lib/create_text_theme.dart,\
  lib/version.dart,\
  lib/home_shell.dart,\
  lib/crash_recovery_screen.dart,\
  lib/widgets/**,\
  lib/features/goals/**,\
  lib/features/dashboard/**,\
  lib/features/instructions/**,\
  lib/features/auth/**,\
  lib/features/chat/mcq_options_widget.dart,\
  lib/features/chat/composer_mcq_wait_widget.dart,\
  lib/services/config/azure_config.dart,\
  lib/services/tutor/env.dart

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.dart.lcov.reportPaths=coverage/lcov.info
