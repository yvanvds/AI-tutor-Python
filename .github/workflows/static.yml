# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab.
  #
  # tooling/build_release.ps1 also dispatches it, as its last step, so the
  # download section shows a new release right away (#291). The push of the
  # release commit (step 8) deploys before `gh release create` (step 9), so
  # that run still finds the previous release. A `release: published` trigger
  # cannot take over: the github-pages environment only lets `main` deploy, and
  # a release run is on the tag ref, so its deploy would be refused. Dispatch,
  # never rerun: a rerun piles up duplicate `github-pages` artifacts and the
  # deploy fails.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Version, date, size and SHA-256 of the latest release next to the
      # download button (#291), written into the published copy of the pages
      # here, so the site needs no JavaScript and no browser ever calls the
      # GitHub API (60 requests per hour per IP: one class would use it up).
      # The script changes nothing unless it can fill every page; if it fails,
      # the deploy still goes out and the pages keep their fallback text.
      - name: Fill in the latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/site/fill_release.py --site public
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
